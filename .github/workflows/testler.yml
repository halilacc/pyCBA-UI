name: testler

# 78 test README'nin güven argümanının tamamı; elle çalıştırılmaya bırakılmaz.
# Ayrıca bağımlılık sabitlerinin (özellikle streamlit~=1.59.2) gerçekten
# kurulabildiğini ve arayüzün AppTest altında hâlâ açıldığını doğrular.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 = Streamlit Cloud'un çalıştırdığı sürüm, 3.14 = geliştirme sürümü.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testler
        # MPLBACKEND: koşucuda ekran yok; şema testleri Agg ile çizsin.
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

      - name: Referans problem (el hesabıyla doğrulanmış)
        env:
          MPLBACKEND: Agg
        run: python ornek1_surekli_kiris.py
